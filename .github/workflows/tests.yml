name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Generate dashboard data
        env:
          PYTHONPATH: .
        run: python -m backtest.export_dashboard
      - name: Verify dashboard export
        run: |
          test -s app/data/demo-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/data/demo-results.json").read_text(encoding="utf-8"))
          assert payload["live_data"] is False
          assert payload["broker_connected"] is False
          assert len(payload["market_events"]) == 7
          print("Dashboard export verified")
          PY

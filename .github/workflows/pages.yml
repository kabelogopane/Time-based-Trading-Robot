name: Deploy robot dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate dashboard data from research engine
        env:
          PYTHONPATH: .
        run: python scripts/export_demo_results.py data/sample_45m_sessions.csv --output app/data/demo-results.json

      - name: Verify dashboard data
        run: |
          test -s app/data/demo-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("app/data/demo-results.json").read_text(encoding="utf-8"))
          assert payload["live_data"] is False
          assert payload["broker_connected"] is False
          assert payload["sessions"]
          print(f"Dashboard data verified: {len(payload['sessions'])} sessions")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
